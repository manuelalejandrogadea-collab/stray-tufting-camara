name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android

      - name: Compilar APK con Gradle
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Stray-Tufting-Camara-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
