name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar EAS CLI de manera global
        run: npm install -g eas-cli

      - name: Ejecutar build local con EAS
        run: npx eas-cli build --platform android --profile preview --local --non-interactive

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Stray-Tufting-Camara-APK
          path: '*.apk'
