name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto Android con Expo
        run: npx expo prebuild --platform android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Subir APK como artefacto para descargar
        uses: actions/upload-artifact@v3
        with:
          name: Stray-Tufting-Camara-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
