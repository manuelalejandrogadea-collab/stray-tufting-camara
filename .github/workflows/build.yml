name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Generar archivos nativos de Android con Expo
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK Release con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Subir APK generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Stray-Tufting-Camara-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
